{% extends 'base.html' %}{% block content %}<section class="panel"><div class="section-heading"><div><p class="eyebrow">INBOX</p><h2>Notifications</h2></div></div>{% for notification in items %}<div class="task-row"><div><strong>{{ notification.title }}</strong><p class="muted">{{ notification.message }}</p></div><small>{{ notification.created_at.strftime('%b %d, %I:%M %p') }}</small></div>{% else %}<div class="empty-state">You are all caught up.</div>{% endfor %}</section>{% endblock %}
