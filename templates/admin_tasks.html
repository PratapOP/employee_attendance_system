{% extends 'base.html' %}{% block content %}<div class="dashboard-grid"><section class="panel"><div class="section-heading"><div><p class="eyebrow">ASSIGN WORK</p><h2>New task</h2></div></div><form method="post" class="form-stack"><label>Task title<input name="title" required placeholder="e.g. Confirm venue load-in"></label><label>Description<textarea name="description"></textarea></label><label>Employee<select name="employee_id" required>{% for person in employees %}<option value="{{ person.id }}">{{ person.name }} · {{ person.emp_id }}</option>{% endfor %}</select></label><div class="two-col"><label>Priority<select name="priority"><option>HIGH</option><option selected>MEDIUM</option><option>LOW</option></select></label><label>Due date<input type="date" name="due_date"></label></div><button class="button primary" type="submit">Assign task <span>-></span></button></form></section><section class="panel"><div class="section-heading"><div><p class="eyebrow">DELIVERY QUEUE</p><h2>All tasks</h2></div></div><div class="task-list">{% for task in tasks %}<div class="task-row"><div><strong>{{ task.title }}</strong><small>{{ task.name }} · {{ task.due_date or 'No due date' }}</small></div><span class="status-badge {{ task.status|lower }}">{{ task.status|replace('_',' ')|title }}</span></div>{% else %}<div class="empty-state">No tasks have been assigned.</div>{% endfor %}</div></section></div>{% endblock %}
