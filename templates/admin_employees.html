{% extends 'base.html' %}{% block content %}<div class="dashboard-grid"><section class="panel"><div class="section-heading"><div><p class="eyebrow">WORKFORCE</p><h2>Add employee</h2></div></div><form method="post" class="form-stack"><input type="hidden" name="action" value="create"><label>EMP ID<input name="emp_id" required placeholder="EMP006"></label><label>Name<input name="name" required></label><label>Email<input type="email" name="email"></label><div class="two-col"><label>Department<input name="department" placeholder="Event Operations"></label><label>Designation<input name="designation"></label></div><label>Temporary password<input type="password" name="password" required></label><button class="button primary" type="submit">Add employee <span>-></span></button></form></section><section class="panel"><div class="section-heading"><div><p class="eyebrow">DIRECTORY</p><h2>Employee access</h2></div></div><div class="task-list">{% for person in employees %}<div class="task-row"><div><strong>{{ person.name }}</strong><small>{{ person.emp_id }} · {{ person.department or 'General' }}</small></div><form method="post"><input type="hidden" name="action" value="toggle"><input type="hidden" name="user_id" value="{{ person.id }}"><button class="button {{ 'danger' if person.is_active else 'primary' }}" type="submit">{{ 'Deactivate' if person.is_active else 'Activate' }}</button></form></div>{% else %}<div class="empty-state">No employees yet.</div>{% endfor %}</div></section></div>{% endblock %}
